<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 Websites</title>
<meta name="description" content="2026 Websites: a quick homage to Marina Budarina's koi page (@marina_uiux), the page that started Unhinged & On-Brief No. 1, CARP.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* a quick homage to Marina Budarina's koi page (budarina-koi.runable.site): same parts, our words & fish.
     Magenta & Fraunces: Q 2026-11-09 */
  :root { --bg: #c2185b; --ink: #fbf3e6; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: 'JetBrains Mono', ui-monospace, monospace; color: #fff; cursor: default; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #stars { z-index: 0; } #under { z-index: 1; } #over { z-index: 3; }
  .word { position: fixed; inset: 0; z-index: 2; display: grid; place-content: center; text-align: center; pointer-events: none;
    font-family: 'Fraunces', serif; font-weight: 800; color: var(--ink); letter-spacing: -.045em; }
  .word .yr { display: block; font-size: min(52vh, 36vw); line-height: .78; }
  .word .ws { display: block; font-size: min(17vh, 12vw); line-height: .9; letter-spacing: -.03em; }
  .word i { display: inline-block; font-style: normal; opacity: 0; transform: translateY(.18em); filter: blur(12px);
    animation: in 1.1s cubic-bezier(.2, .8, .2, 1) forwards; }
  @keyframes in { to { opacity: 1; transform: none; filter: blur(0); } }
  #ws i:first-child { margin-right: -.07em; }   /* kern the W into the e (Q: too far apart) */
  .side { position: fixed; z-index: 4; font-size: 11px; font-weight: 500; letter-spacing: .08em; line-height: 1.25; text-transform: uppercase; opacity: 0; animation: fade 1s 2.2s forwards; }
  @keyframes fade { to { opacity: 1; } }
  /* the chrome, as hers: a white square mark top left, a white pill top right, the count bottom left, About bottom centre */
  .mark { position: fixed; z-index: 5; top: 20px; left: 20px; width: 42px; height: 42px; display: block; }   /* the Q logo (Q) */
  .pill { position: fixed; z-index: 5; top: 20px; right: 20px; display: flex; gap: 2px; padding: 3px; border-radius: 7px; background: #fff; }
  .pill b, .pill a { display: grid; place-items: center; min-width: 32px; height: 32px; padding: 0 2px; border-radius: 5px; color: #202020; font-size: 11.2px; font-weight: 500; }
  .pill a { text-decoration: none; }
  .pill .c { padding: 0 12px; background: #e3e3e3; letter-spacing: .02em; }
  .pill svg { width: 13px; height: 13px; }
  .koi { position: fixed; z-index: 5; left: 20px; bottom: 34px; display: flex; align-items: center; gap: 4px; height: 34px; padding: 0 6px; border-radius: 6px;
    background: rgba(0, 0, 0, .14); font-size: 11.2px; letter-spacing: .08em; }
  .koi button { all: unset; cursor: pointer; width: 26px; text-align: center; font-size: 17.6px; font-weight: 600; }
  .about { position: fixed; z-index: 5; left: 50%; bottom: 34px; transform: translateX(-50%); height: 34px; padding: 0 14px; border-radius: 6px;
    background: rgba(0, 0, 0, .14); display: grid; place-items: center; font-size: 11.2px; font-weight: 500; color: inherit; text-decoration: none; }
  /* Marina's handle goes to her Instagram (Q 2026-11-09) */
  .side a { color: inherit; text-decoration: none; } .side a:hover { text-decoration: underline; text-underline-offset: 2px; }
</style></head>
<body>
<canvas id="stars"></canvas><canvas id="under"></canvas>
<div class="word" aria-label="2026 Websites"><span class="yr" id="yr">2026</span><span class="ws" id="ws">Websites</span></div>
<canvas id="over"></canvas>
<div class="side" id="sl">Badass creative</div><div class="side" id="sr">Après<br><a href="https://www.instagram.com/marina_uiux/" target="_blank" rel="noopener noreferrer">@marina_uiux</a></div>
<img class="mark" src="q-logo.png" alt="Q">
<div class="pill"><b><svg viewBox="0 0 16 16" fill="#202020"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11 6l4 4M15 6l-4 4" stroke="#202020" stroke-width="1.4"/></svg></b><a class="c" href="https://www.qmanning.com/about">CONTACT</a></div>
<div class="koi"><button id="less">−</button><span id="count">3 KOI</span><button id="more">+</button></div>
<a class="about" href="https://www.qmanning.com/about">ABOUT</a>
<script>
const $ = id => document.getElementById(id);
// the word types in letter by letter
let d = .35; for (const el of [$('yr'), $('ws')]) { el.innerHTML = [...el.textContent].map(ch => `<i style="animation-delay:${(d += .09).toFixed(2)}s">${ch}</i>`).join(''); d += .15; }
// the side labels sit by the word: the left one under "2026"'s first figure, the right one by "Websites"' end
function placeSides() { const a = $('yr').getBoundingClientRect(), b = $('ws').getBoundingClientRect();
  // eyebrow above the 2, flush with its left edge; Marina's handle under the 6, right-aligned to it (Q 2026-11-09)
  const g0 = $('yr').firstElementChild.getBoundingClientRect(), g3 = $('yr').lastElementChild.getBoundingClientRect();
  // where the figures' ink actually starts (the line box is tighter than the glyphs), so the eyebrow sits clear above it
  const cs = getComputedStyle($('yr')), fs = parseFloat(cs.fontSize), lh = parseFloat(cs.lineHeight) || fs * .78, mc = document.createElement('canvas').getContext('2d');
  mc.font = `800 ${fs}px Fraunces`; const m = mc.measureText('2026'), base = a.top + (lh - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2 + m.fontBoundingBoxAscent;
  const top = base - m.actualBoundingBoxAscent;
  $('sl').style.left = g0.left + 'px'; $('sl').style.top = (top - 14) + 'px'; $('sl').style.transform = 'translateY(-100%)';
  $('sr').style.left = 'auto'; $('sr').style.right = (innerWidth - g3.right) + 'px'; $('sr').style.top = (a.bottom + 6) + 'px'; $('sr').style.textAlign = 'right'; }
document.fonts.ready.then(placeSides); addEventListener('resize', placeSides);

const cv = { stars: $('stars'), under: $('under'), over: $('over') }, g = {};
let W, H, DPR;
// the koi canvases are WebGL (each koi is a mesh laid along its swum path); the ripples stay 2D
const gls = { under: cv.under.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: true }), over: cv.over.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: true }) };
g.stars = cv.stars.getContext('2d');
function size() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  for (const k in cv) { cv[k].width = W * DPR; cv[k].height = H * DPR; } g.stars.setTransform(DPR, 0, 0, DPR, 0, 0); }
size(); addEventListener('resize', size);

// little bubbles all over, where Marina had sparkles (Q): each one appears somewhere, swells slowly as it drifts up a
// hair, then pops (a quick ring out & a few droplets) & another starts elsewhere
const bubbles = [];
function newBubble(t, born) { return { x: Math.random() * W, y: Math.random() * H, r: 2.5 + Math.random() * 5.5, t0: t - (born ? Math.random() * 4 : 0), life: 2.5 + Math.random() * 3.5, dr: (Math.random() - .5) * 6 }; }
function drawRings(t) {
  const c = g.stars; c.clearRect(0, 0, W, H);
  const want = Math.round(W * H / 26000); while (bubbles.length < want) bubbles.push(newBubble(t, !bubbles.length || t < .1));
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i], age = t - b.t0;
    if (age < 0) continue;
    const u = age / b.life, y = b.y - age * 4, x = b.x + Math.sin(age * 1.3 + b.dr) * 2;
    if (u < 1) {   // swelling
      const r = b.r * Math.pow(Math.min(1, u * 1.15), .7), a = Math.min(1, u * 4) * .55;
      c.lineWidth = 1; c.strokeStyle = `rgba(255,240,226,${a})`; c.fillStyle = `rgba(255,240,226,${a * .12})`;
      c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.fill(); c.stroke();
      c.fillStyle = `rgba(255,255,255,${a * 1.2})`; c.beginPath(); c.arc(x - r * .38, y - r * .38, Math.max(.6, r * .22), 0, 6.2832); c.fill();   // the glint
    } else {   // pop: a thin ring flicks out & fades, a few droplets fly
      const p = (age - b.life) / .28; if (p > 1) { bubbles[i] = newBubble(t, false); continue; }
      const r = b.r * (1 + p * 1.6); c.lineWidth = 1; c.strokeStyle = `rgba(255,240,226,${(1 - p) * .55})`; c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.stroke();
      c.fillStyle = `rgba(255,240,226,${(1 - p) * .7})`;
      for (let k = 0; k < 5; k++) { const an = k / 5 * 6.2832 + b.dr; c.beginPath(); c.arc(x + Math.cos(an) * r * 1.35, y + Math.sin(an) * r * 1.35, .9, 0, 6.2832); c.fill(); }
    }
  }
}
// ---------- the koi: swum the way the CARP fish swim (Q: "look at what we did on the CARP site") ----------
// the head steers for a waypoint; the body is laid along the trail the head actually swam (so it curves through every
// turn like a real fish), with a small tail wave on top. Waypoints: pick open water, swim there, then glide on slowly for
// a few seconds before the next. Speed eases with distance; turns are wide & even, never tight curls.
const SRC = ['gold-2', 'green', 'white-orange'];   // gold-2: the fancy-finned one, after Marina's (Q)
const KOI = [{ i: 0, size: .78, over: true }, { i: 1, size: .5, over: false }, { i: 2, size: .58, over: true }];   // the gold one leads: biggest (Q)
const VS = `attribute vec2 p; attribute vec2 uv; uniform vec2 res; uniform vec2 off; varying vec2 v;
  void main() { v = uv; vec2 c = (p + off) / res * 2. - 1.; gl_Position = vec4(c.x, -c.y, 0, 1); }`;
const FS = `precision mediump float; uniform sampler2D s; uniform float shade, a; varying vec2 v;
  void main() { vec4 c = texture2D(s, v); gl_FragColor = (shade > .5 ? vec4(0, 0, 0, c.a) : c) * a; }`;
function setupGL(gl) {
  const sh = (t, src) => { const o = gl.createShader(t); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr);
  const U = {}; for (const n of ['res', 'off', 's', 'shade', 'a']) U[n] = gl.getUniformLocation(pr, n);
  const buf = gl.createBuffer(), ibuf = gl.createBuffer(), lp = gl.getAttribLocation(pr, 'p'), lu = gl.getAttribLocation(pr, 'uv');
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  const tex = SRC.map(n => { const t = gl.createTexture(), im = new Image(); im.onload = () => { gl.bindTexture(gl.TEXTURE_2D, t); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
    for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
    t.ok = im; }; im.src = `fish/${n}.png`; return t; });
  return { gl, U, buf, ibuf, lp, lu, tex };
}
const R = { under: setupGL(gls.under), over: setupGL(gls.over) };
const NA = 70, NX = 14;   // mesh: 70 rows along the body, 14 columns across (so the fancy fins can ripple)
const IDX = (() => { const a = []; for (let j = 0; j < NA; j++) for (let i = 0; i < NX; i++) { const k = j * (NX + 1) + i; a.push(k, k + 1, k + NX + 1, k + 1, k + NX + 2, k + NX + 1); } return new Uint16Array(a); })();

class Koi {
  constructor(k, spread) { Object.assign(this, KOI[k]); this.k = k; this.ph = k * 2.1; this.phase = this.ph; this.speed = 0;
    if (spread) { this.x = W * [.32, .7, .55][k]; this.y = H * [.35, .62, .8][k]; this.a = [.3, 3.6, -1.9][k]; }
    else { const side = Math.random() < .5; this.x = side ? -H * .4 : W + H * .4; this.y = H * (.3 + .4 * Math.random()); this.a = side ? 0 : Math.PI; }
    this.trail = []; for (let s = 0; s < 3000; s += 3) this.trail.push({ x: this.x - Math.cos(this.a) * s, y: this.y - Math.sin(this.a) * s }); this.w = null; }
  get len() { return H * this.size; }
  pick(t) {   // open water: of a handful of spots far enough off, the one furthest from the other koi
    const L = this.len; let best = null, bd = -1;
    for (let n = 0; n < 14; n++) { const c = { x: W * (.1 + .8 * Math.random()), y: H * (.12 + .76 * Math.random()) }; if (Math.hypot(c.x - this.x, c.y - this.y) < L * .8) continue;
      let m = 1e9; for (const o of fish) if (o !== this) m = Math.min(m, Math.hypot(o.x - c.x, o.y - c.y), o.w ? Math.hypot(o.w.x - c.x, o.w.y - c.y) : 1e9);
      if (m > bd) { bd = m; best = c; } }
    this.w = { ...(best || { x: W / 2, y: H / 2 }), arrived: 0, dwell: 1.4 + Math.random() * 3.2 };
  }
  step(dt, t) {
    const L = this.len;
    if (!this.w) this.pick(t);
    if (!this.w.arrived && Math.hypot(this.x - this.w.x, this.y - this.w.y) < L * .35) this.w.arrived = t;
    if (this.w.arrived && t - this.w.arrived > this.w.dwell) this.pick(t);
    const glide = !!this.w.arrived, p = this.call && t < this.call.until ? this.call : glide ? { x: this.x + Math.cos(this.a) * L, y: this.y + Math.sin(this.a) * L } : this.w;
    let tx = p.x, ty = p.y;
    for (const o of fish) if (o !== this) {   // keep a body-width apart
      const dx = this.x - o.x, dy = this.y - o.y, d = Math.hypot(dx, dy), min = (L + o.len) * .4;
      if (d < min && d > 0) { tx += dx / d * (min - d) * 2; ty += dy / d * (min - d) * 2; } }
    const want = Math.atan2(ty - this.y, tx - this.x), dd = ((want - this.a + Math.PI * 3) % (Math.PI * 2)) - Math.PI, dist = Math.hypot(tx - this.x, ty - this.y);
    const cruise = glide ? L * .07 : Math.min(L * .32, Math.max(L * .1, 20 + dist * .3));   // far: a little quicker; near: cruise; arrived: glide
    this.speed += (cruise - this.speed) * Math.min(1, dt * 1.2);
    const turn = Math.min(1.1, Math.max(.22, this.speed / (L * .55)));   // wide, even turns
    this.a += Math.max(-turn * dt, Math.min(turn * dt, dd));
    this.x += Math.cos(this.a) * this.speed * dt; this.y += Math.sin(this.a) * this.speed * dt;
    this.phase += dt * (1.6 + this.speed / L * 5);
    const last = this.trail[0]; if (!last || Math.hypot(last.x - this.x, last.y - this.y) > 1.5) this.trail.unshift({ x: this.x, y: this.y }); if (this.trail.length > 2400) this.trail.length = 2400;
  }
  at(s) { let acc = 0, p = { x: this.x, y: this.y };
    for (const q of this.trail) { const seg = Math.hypot(q.x - p.x, q.y - p.y); if (acc + seg >= s && seg > 0) { const u = (s - acc) / seg; return { x: p.x + (q.x - p.x) * u, y: p.y + (q.y - p.y) * u }; } acc += seg; p = q; }
    return { x: p.x - Math.cos(this.a) * (s - acc), y: p.y - Math.sin(this.a) * (s - acc) }; }
  mesh(t) {   // rows along the body (the head leads, the body follows the trail), columns across the width
    const im = R.over.tex[this.i].ok || R.under.tex[this.i].ok; if (!im) return null;
    const L = this.len, w = im.width / im.height * L, v = new Float32Array((NA + 1) * (NX + 1) * 4), fancy = this.i === 0;
    for (let j = 0; j <= NA; j++) {
      const u = j / NA, s = u * L, p = this.at(s), pa = this.at(Math.max(0, s - L * .09)), pb = this.at(s + L * .09);
      const a = Math.atan2(pa.y - pb.y, pa.x - pb.x), nx = -Math.sin(a), ny = Math.cos(a), tx = -Math.cos(a), ty = -Math.sin(a);   // n: across; t: toward the tail
      const wave = Math.sin(this.phase - u * 5) * L * .04 * Math.pow(u, 1.7);
      for (let i = 0; i <= NX; i++) {
        const xu = i / NX, e = Math.abs(xu - .5) * 2, side = Math.sign(xu - .5);
        let across = (xu - .5) * w + wave, along = 0;
        if (fancy) {   // the gold koi's fins & tail: slow, wavy, swirly (Q), more the further from the spine
          const fin = Math.max(0, Math.min(1, (e - .22) / .78)) ** 1.2, tail = Math.max(0, Math.min(1, (u - .62) / .38)), m = Math.max(fin, tail * (.4 + .6 * e));
          across += side * m * L * .028 * Math.sin(t * 1.7 - u * 6 - e * 3.5 + this.ph) + tail * L * .03 * Math.sin(t * 2.1 - u * 9 + e * 2 + this.ph);
          along += m * L * .032 * Math.sin(t * 1.4 - e * 5.5 + u * 4 + this.ph * 1.3);
        }
        v.set([p.x + nx * across + tx * along, p.y + ny * across + ty * along, xu, u], (j * (NX + 1) + i) * 4);
      }
    }
    return v;
  }
}
function drawKoi(r, f, v) {
  const { gl, U } = r; if (!r.tex[f.i].ok) return;
  gl.bindBuffer(gl.ARRAY_BUFFER, r.buf); gl.bufferData(gl.ARRAY_BUFFER, v, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(r.lp); gl.vertexAttribPointer(r.lp, 2, gl.FLOAT, false, 16, 0); gl.enableVertexAttribArray(r.lu); gl.vertexAttribPointer(r.lu, 2, gl.FLOAT, false, 16, 8);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, r.ibuf); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, IDX, gl.STATIC_DRAW);
  gl.bindTexture(gl.TEXTURE_2D, r.tex[f.i]); gl.uniform1i(U.s, 0); gl.uniform2f(U.res, W, H);
  const L = f.len; gl.uniform1f(U.shade, 1);   // a soft shadow: the silhouette, a few times, offset down & right
  for (const [dx, dy] of [[0, 0], [6, 5], [-5, 7], [3, -4]]) { gl.uniform2f(U.off, L * .05 + dx, L * .07 + dy); gl.uniform1f(U.a, .07); gl.drawElements(gl.TRIANGLES, IDX.length, gl.UNSIGNED_SHORT, 0); }
  gl.uniform1f(U.shade, 0); gl.uniform2f(U.off, 0, 0); gl.uniform1f(U.a, 1); gl.drawElements(gl.TRIANGLES, IDX.length, gl.UNSIGNED_SHORT, 0);
}

let fish = [];
fish = KOI.map((_, k) => new Koi(k, true));
let n = 3; function setN(m) { n = Math.max(1, Math.min(3, m)); $('count').textContent = n + ' KOI'; while (fish.length < n) fish.push(new Koi(fish.length, false)); fish.length = n; }
$('less').onclick = () => setN(n - 1); $('more').onclick = () => setN(n + 1);
addEventListener('pointerdown', e => { if (e.target.closest('button,a,.pill,.mark,.about')) return; let best = null, bd = 1e9;   // a click calls the nearest koi over
  for (const f of fish) { const dd = Math.hypot(f.x - e.clientX, f.y - e.clientY); if (dd < bd) { bd = dd; best = f; } } if (best) best.call = { x: e.clientX, y: e.clientY, until: performance.now() / 1000 + 4 }; });

let last = 0;
function frame(ms) {
  const t = ms / 1000, dt = Math.min(.05, t - last || 0); last = t;
  drawRings(t);
  for (const k of ['under', 'over']) { const gl = R[k].gl; gl.viewport(0, 0, W * DPR, H * DPR); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); }
  for (const f of fish) {
    f.step(dt, t);
    const v = f.mesh(t); if (v) drawKoi(f.over ? R.over : R.under, f, v);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
